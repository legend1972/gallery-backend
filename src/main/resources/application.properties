spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/gallery
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath*:com/gallery/api/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

#실행된 SQL과 파라미터 값 터미널 로그 출력
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

#MyBatis SQL 로그만 출력하도록 설정
logging.level.com.gallery.api=DEBUG
logging.level.org.mybatis=DEBUG

#마지막 요청 이후 약 30분 동안 세션을 유지
server.servlet.session.timeout=30m

# 파일 업로드 루트 경로
file.upload.root-path=C:/gallery/uploads
# 개별 파일 최대 크기
spring.servlet.multipart.max-file-size=5MB
# 한 요청 전체 최대 크기
spring.servlet.multipart.max-request-size=20MB